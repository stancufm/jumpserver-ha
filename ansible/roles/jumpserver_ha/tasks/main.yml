---
- name: Validate the selected HA role
  ansible.builtin.assert:
    that: jumpserver_ha_role in ['active', 'standby']

- name: Create HA state directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0750'
  loop:
    - /etc/jumpserver-ha
    - /etc/jumpserver-ha/keys
    - /var/lib/jumpserver-ha

- name: Install the role-aware login warning
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd
    owner: root
    group: root
    mode: '0644'

- name: Install the operational runbook
  ansible.builtin.copy:
    src: '{{ role_path }}/README.md'
    dest: '{{ jumpserver_ha_runbook_path }}'
    owner: root
    group: root
    mode: '0644'

- name: Install GR collection unit templates on every peer
  ansible.builtin.template:
    src: '{{ item }}'
    dest: '/etc/systemd/system/{{ item | regex_replace("\\.j2$", "") }}'
    owner: root
    group: root
    mode: '0644'
  loop:
    - gr-config-collect@.service.j2
    - gr-config-collect@.timer.j2
  notify: Reload systemd

- name: Keep operational collection timers disabled on the standby
  ansible.builtin.systemd:
    name: 'gr-config-collect@{{ item }}.timer'
    enabled: false
    state: stopped
  loop: '{{ jumpserver_ha_collection_pools | default([]) }}'
  when: jumpserver_ha_role == 'standby'

# The exporter, restricted authorized_keys entry, service and timer are supplied
# as templates in the next implementation increment. No service is enabled by
# this design-only role skeleton.
